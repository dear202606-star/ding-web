<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="定蛇报道 · 比较关系图"><rect x="8" y="8" width="704" height="484" rx="12" fill="#fbf6e9" stroke="#d9ccae"/><text x="40" y="52" font-size="23" fill="#7a2318" font-family="serif">定蛇报道 · 比较关系图</text><rect x="45" y="95" width="300" height="170" rx="10" fill="#f1ead9" stroke="#c5b48f"/><rect x="375" y="95" width="300" height="170" rx="10" fill="#f1ead9" stroke="#c5b48f"/><text x="70" y="135" font-size="23" fill="#4a4132" font-family="serif">报道中的演示</text><text x="70" y="180" font-size="19" fill="#4a4132" font-family="serif">包含画符环节</text><text x="70" y="222" font-size="19" fill="#4a4132" font-family="serif">叙述结果：蛇不动</text><text x="400" y="135" font-size="23" fill="#4a4132" font-family="serif">报道中的去符比较</text><text x="400" y="180" font-size="19" fill="#4a4132" font-family="serif">省略画符环节</text><text x="400" y="222" font-size="19" fill="#4a4132" font-family="serif">叙述结果：蛇仍不动</text><text x="50" y="320" font-size="22" fill="#4a4132" font-family="serif">比较要点：本次演示不以画符为必要环节。</text><text x="50" y="368" font-size="19" fill="#4a4132" font-family="serif">不能直接推出：所有蛇、所有犬或所有术法均如此。</text><text x="50" y="420" font-size="19" fill="#4a4132" font-family="serif">报道图解，不是本项目实施的动物实验。</text><text x="50" y="462" font-size="17" fill="#4a4132" font-family="serif">原始视频、样本及程序仍需核对。</text></svg>