<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="动物防御反应 · 概念层次"><rect x="8" y="8" width="704" height="484" rx="12" fill="#fbf6e9" stroke="#d9ccae"/><text x="40" y="52" font-size="23" fill="#7a2318" font-family="serif">动物防御反应 · 概念层次</text><rect x="55" y="90" width="610" height="80" rx="10" fill="#f1ead9" stroke="#c5b48f"/><text x="80" y="124" font-size="24" fill="#4a4132" font-family="serif">觉醒／警戒</text><text x="80" y="152" font-size="18" fill="#4a4132" font-family="serif">对环境变化作出反应</text><rect x="55" y="195" width="610" height="80" rx="10" fill="#f1ead9" stroke="#c5b48f"/><text x="80" y="229" font-size="24" fill="#4a4132" font-family="serif">战、逃或冻结</text><text x="80" y="257" font-size="18" fill="#4a4132" font-family="serif">行为受情境与个体差异影响</text><rect x="55" y="300" width="610" height="80" rx="10" fill="#f1ead9" stroke="#c5b48f"/><text x="80" y="334" font-size="24" fill="#4a4132" font-family="serif">强直不动 TI</text><text x="80" y="362" font-size="18" fill="#4a4132" font-family="serif">与一般静止、安静服从须区分</text><text x="40" y="452" font-size="19" fill="#4a4132" font-family="serif">概念分层，非所有犬必经的固定顺序。</text><text x="40" y="477" font-size="17" fill="#4a4132" font-family="serif">本图不作为民俗个案机制的诊断证明。</text></svg>